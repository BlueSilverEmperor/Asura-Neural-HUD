<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASURA — Neural Multimodal HUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050508;
            --panel: #0d0e15;
            --accent: #ff0055;
            --accent-dim: rgba(255, 0, 85, 0.2);
            --cyan: #00f0ff;
            --text: #ffffff;
            --text-dim: #71717a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Share Tech Mono', monospace; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; }
        .hud-frame { max-width: 900px; width: 100%; background: var(--panel); border: 1px solid #27272a; border-radius: 12px; padding: 2rem; box-shadow: 0 0 50px rgba(255, 0, 85, 0.1); position: relative; }
        .hud-frame::before { content: ""; position: absolute; top: -1px; left: 20px; width: 80px; height: 3px; background: var(--accent); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #27272a; padding-bottom: 1rem; margin-bottom: 1.5rem; }
        .title { font-size: 1.5rem; color: var(--accent); letter-spacing: 3px; font-weight: 700; }
        .status-pill { font-size: 0.8rem; color: var(--cyan); border: 1px solid var(--cyan); padding: 4px 10px; border-radius: 4px; }
        .visualizer { height: 100px; background: #000; border: 1px solid #27272a; border-radius: 8px; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: center; gap: 4px; padding: 0 20px; overflow: hidden; }
        .bar { width: 6px; background: var(--accent); border-radius: 2px; animation: wave 0.8s ease-in-out infinite alternate; }
        @keyframes wave {
            0% { height: 8px; opacity: 0.4; }
            100% { height: 75px; opacity: 1; }
        }
        .console { background: #000; border: 1px solid #27272a; border-radius: 8px; padding: 1rem; height: 160px; overflow-y: auto; font-size: 0.85rem; color: #a1a1aa; margin-bottom: 1.5rem; }
        .console-line { margin-bottom: 0.35rem; }
        .highlight { color: var(--cyan); }
        .input-bar { display: flex; gap: 10px; }
        input { flex: 1; background: #000; border: 1px solid #3f3f46; padding: 12px 16px; border-radius: 6px; color: white; font-family: inherit; font-size: 0.95rem; outline: none; }
        input:focus { border-color: var(--accent); }
        button { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 6px; font-family: inherit; font-weight: 700; cursor: pointer; letter-spacing: 1px; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="hud-frame">
        <div class="header">
            <div class="title">ASURA // NEURAL CORE v4.2</div>
            <div class="status-pill">● SENSORS ONLINE</div>
        </div>
        <div class="visualizer" id="bars"></div>
        <div class="console" id="console">
            <div class="console-line">[BOOT] Initializing Asura Multimodal Subsystem...</div>
            <div class="console-line">[VISION] OpenCV Facial Feature Extraction: <span class="highlight">ARMED</span></div>
            <div class="console-line">[AUDIO] DSP Speech Engine: <span class="highlight">SYNCHRONIZED</span></div>
            <div class="console-line">[STATUS] System ready for query input.</div>
        </div>
        <div class="input-bar">
            <input type="text" id="query" placeholder="Transmit command or query..." value="analyze defensive perimeter telemetry" />
            <button onclick="sendCommand()">EXECUTE</button>
        </div>
    </div>
    <script>
        const visualizer = document.getElementById('bars');
        for (let i = 0; i < 45; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.animationDelay = `${(i * 0.04) % 0.8}s`;
            visualizer.appendChild(bar);
        }
        function sendCommand() {
            const input = document.getElementById('query');
            const consoleBox = document.getElementById('console');
            const val = input.value.trim();
            if(!val) return;
            consoleBox.innerHTML += `<div class="console-line" style="color:white">&gt; ${val}</div>`;
            setTimeout(() => {
                consoleBox.innerHTML += `<div class="console-line" style="color:#00f0ff">[ASURA] Telemetry verified. Sector latency nominal (1.8ms). No intrusions identified.</div>`;
                consoleBox.scrollTop = consoleBox.scrollHeight;
            }, 400);
            input.value = '';
        }
    </script>
</body>
</html>
